name: proper_store
description: "An E-Commerce Web App for selling women bags and shoes"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Provides internationalization and localization facilities, including message translation, plurals and genders, date/number formatting and parsing, and bidirectional text.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Fonts
  google_fonts: ^6.3.2

  # State Management & DI
  flutter_bloc: ^9.1.1
  get_it: ^9.2.0

  # Navigation
  go_router: ^13.2.0

  # Images
  cached_network_image: ^3.4.1

  # Firebase
  firebase_core: ^4.4.0

  # Annotations
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Code Generation Tools
  build_runner: ^2.4.8
  freezed: 2.4.7
  json_serializable: ^6.7.1

  # Testing
  mockito: ^5.4.4
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
flutter_intl:
  main_locale: ar
  enabled: true
