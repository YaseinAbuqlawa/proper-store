name: proper_store
description: "An E-Commerce Web App for selling women bags and shoes"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Provides internationalization and localization facilities, including message translation, plurals and genders, date/number formatting and parsing, and bidirectional text.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Fonts
  google_fonts: ^8.0.1

  # State Management & DI
  flutter_bloc: ^9.1.1
  get_it: ^9.2.0
  injectable: ^2.7.1+4
  injectable_generator: ^2.6.2

  # Navigation
  go_router: ^17.1.0

  # Either (failure handling)
  fpdart: ^1.2.0

  # Images
  cached_network_image: ^3.4.1

  # Firebase
  firebase_core: ^4.4.0

  # Annotations
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  cloud_firestore: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Code Generation Tools
  build_runner: ^2.4.8
  freezed: ^3.2.5
  json_serializable: ^6.7.1

  # Testing
  mockito: ^5.4.4
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
flutter_intl:
  main_locale: ar
  enabled: true
