name: proper_store
description: "An E-Commerce Web App for selling women bags and shoes"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Provides internationalization and localization facilities, including message translation, plurals and genders, date/number formatting and parsing, and bidirectional text.
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  intl: ^0.20.2

  # Fonts
  google_fonts: ^8.0.1

  # State Management & DI
  flutter_bloc: ^9.1.1
  get_it: ^9.2.0
  injectable: ^2.7.1+4
  injectable_generator: ^2.6.2

  # Navigation
  go_router: ^17.1.0

  # Either (failure handling)
  fpdart: ^1.2.0

  # Images
  cached_network_image: ^3.4.1

  # Firebase
  firebase_core: ^4.4.0
  firebase_app_check: ^0.4.1+4

  # Annotations
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  cloud_firestore: ^6.1.2
  smooth_page_indicator: ^2.0.1
  carousel_slider: ^5.1.2
  lottie: ^3.3.2
  flutter_native_splash: ^2.4.7
  firebase_auth: ^6.1.4
  cloud_functions: ^6.0.6
  elegant_notification: ^2.5.1
  awesome_dialog: ^3.3.0
  flutter_svg: ^2.2.3
  skeletonizer: ^2.1.3
  shared_preferences: ^2.5.3
  firebase_analytics: ^12.1.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Code Generation Tools
  build_runner: ^2.4.8
  freezed: ^3.2.5
  json_serializable: ^6.7.1

  # Testing
  mockito: ^5.4.4
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
flutter_intl:
  main_locale: ar
  enabled: true
flutter_native_splash:
    color: "#1E1E1E"
    image: assets/images/proper_logo.png
    fullscreen: true
    web: true 
    web_image_position: center
    web_image_mode: contain
